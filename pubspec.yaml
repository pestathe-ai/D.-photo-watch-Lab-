name: d_photo_watch_lab
description: "D. Photo Watch Lab - migliora le foto degli orologi da vendere, tutto sul telefono."
publish_to: 'none'
version: 0.7.0+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  image: ^4.13.0
  image_picker: ^1.2.4
  gal: ^3.0.0
  google_mlkit_subject_segmentation: ^0.3.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#B3261E"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true
